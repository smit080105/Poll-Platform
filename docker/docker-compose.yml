# ============================================
# PollWave — Production Docker Compose
# ============================================
# Usage: docker compose -f docker/docker-compose.yml up --build

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: pollwave-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pollwave
      POSTGRES_USER: pollwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pollwave-backend
    restart: unless-stopped
    command: node src/index.js
    environment:
      DATABASE_URL: postgresql://pollwave:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/pollwave
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      ORGANIZER_SIGNUP_CODE: ${ORGANIZER_SIGNUP_CODE:-}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Apply versioned database migrations before starting the API ──
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pollwave-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://pollwave:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/pollwave
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Frontend (Nginx) ──
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pollwave-frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in docker/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: pollwave-certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in docker/.env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in docker/.env}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f "/etc/letsencrypt/renewal/$${DOMAIN}.conf" ]; then
          certbot certonly --webroot -w /var/www/certbot \
            --email "$${CERTBOT_EMAIL}" --agree-tos --no-eff-email \
            --domains "$${DOMAIN}" --force-renewal
        fi
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done

volumes:
  postgres_data:
  certbot_conf:
  certbot_webroot:
