# ============================================
# PollWave — Production Docker Compose
# ============================================
# Usage: docker compose -f docker/docker-compose.yml up --build

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: pollwave-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pollwave
      POSTGRES_USER: pollwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pollwave_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pollwave-backend
    restart: unless-stopped
    command: sh -c "npx prisma db push --skip-generate && node src/index.js"
    environment:
      DATABASE_URL: postgresql://pollwave:${POSTGRES_PASSWORD:-pollwave_secret}@postgres:5432/pollwave
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Nginx) ──
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pollwave-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
