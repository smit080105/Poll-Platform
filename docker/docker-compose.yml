# ============================================
# PollWave — Production Docker Compose
# ============================================
# Usage: docker compose -f docker/docker-compose.yml up --build

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: pollwave-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pollwave
      POSTGRES_USER: pollwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pollwave-backend
    restart: unless-stopped
    command: node src/index.js
    environment:
      DATABASE_URL: postgresql://pollwave:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/pollwave
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      ORGANIZER_SIGNUP_CODE: ${ORGANIZER_SIGNUP_CODE:-}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Apply versioned database migrations before starting the API ──
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pollwave-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://pollwave:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/pollwave
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Frontend (Nginx) ──
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pollwave-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
