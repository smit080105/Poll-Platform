# ============================================
# PollWave — CI Pipeline
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Frontend Checks ──
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Backend Checks ──
  backend:
    name: Backend — Lint & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pollwave
          POSTGRES_USER: pollwave
          POSTGRES_PASSWORD: pollwave-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pollwave -d pollwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      # Dummy value — schema validation only checks syntax, it never connects.
      DATABASE_URL: "postgresql://user:password@localhost:5432/pollwave"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://pollwave:pollwave-ci-password@localhost:5432/pollwave
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run backend unit tests
        run: npm run test:unit

  # ── Docker Build Check ──
  docker:
    name: Docker — Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t pollwave-frontend:test .

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t pollwave-backend:test .
