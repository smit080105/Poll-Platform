# ============================================
# PollWave — CI Pipeline
# ============================================

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Frontend Checks ──
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install repository tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ── Backend Checks ──
  backend:
    name: Backend — Lint & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pollwave
          POSTGRES_USER: pollwave
          POSTGRES_PASSWORD: pollwave-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pollwave -d pollwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    env:
      # Dummy value — schema validation only checks syntax, it never connects.
      DATABASE_URL: "postgresql://user:password@localhost:5432/pollwave"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install repository tooling
        run: npm ci --prefix ..

      - name: Lint backend
        run: npm run lint:backend --prefix ..

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://pollwave:pollwave-ci-password@localhost:5432/pollwave
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Start API and run integration tests
        env:
          DATABASE_URL: postgresql://pollwave:pollwave-ci-password@localhost:5432/pollwave?schema=public
          JWT_SECRET: pollwave-ci-jwt-secret
          PORT: 5000
          CLIENT_URL: http://localhost:5173
        run: |
          node src/index.js > /tmp/pollwave-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent http://localhost:5000/api/health >/dev/null; then
            cat /tmp/pollwave-api.log
            exit 1
          fi

          npm run test:integration

  # ── Docker Build Check ──
  docker:
    name: Docker — Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t pollwave-frontend:test .

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t pollwave-backend:test .
